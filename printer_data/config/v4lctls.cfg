[gcode_macro WHITE_BALANCE_AUTO]
gcode:
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c white_balance_automatic=1"

[gcode_macro WHITE_BALANCE_MANUAL]
gcode:
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c white_balance_automatic=0"

[gcode_macro GAIN]
gcode:
    {% if 'GAIN' in params %}
        {% set gain = params.GAIN|int %}
        {% if gain >= 0 and gain <= 255 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c gain={gain}"
        {% else %}
            {action_respond_info("Error: GAIN must be between 0 and 255")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: GAIN GAIN=<0-255>")}
    {% endif %}

[gcode_macro POWER_LINE_FREQUENCY]
gcode:
    {% if 'FREQUENCY' in params %}
        {% set frequency = params.FREQUENCY|int %}
        {% if frequency >= 0 and frequency <= 2 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c power_line_frequency={frequency}"
        {% else %}
            {action_respond_info("Error: FREQUENCY must be 0, 1, or 2 (0: Disabled, 1: 50 Hz, 2: 60 Hz)")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: POWER_LINE_FREQUENCY FREQUENCY=<0, 1, or 2>")}
    {% endif %}

[gcode_macro WHITE_BALANCE_TEMPERATURE]
gcode:
    {% if 'TEMPERATURE' in params %}
        {% set temperature = params.TEMPERATURE|int %}
        {% if temperature >= 2000 and temperature <= 7500 %}
            RUN_SHELL_COMMAND CMD="/path/to/set_white_balance.sh" PARAMS="{temperature}"
        {% else %}
            {action_respond_info("Error: TEMPERATURE must be between 2000 and 7500")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: WHITE_BALANCE_TEMPERATURE TEMPERATURE=<2000-7500>")}
    {% endif %}

[gcode_macro SHARPNESS]
gcode:
    {% if 'SHARPNESS' in params %}
        {% set sharpness = params.SHARPNESS|int %}
        {% if sharpness >= 0 and sharpness <= 255 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c sharpness={sharpness}"
        {% else %}
            {action_respond_info("Error: SHARPNESS must be between 0 and 255")}
        {% endif %}
