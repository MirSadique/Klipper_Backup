[gcode_shell_command v4l2-ctl]
command: v4l2-ctl -d /dev/v4l/by-id/usb-046d_Logitech_Webcam_C930e_C7A0BBDE-video-index0 
timeout: 5.0
verbose: True
    # This macro enables the regex filter
[gcode_macro cam_settings]
gcode:
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-l"

[gcode_macro _SET_CAMERA_CONTROL]
gcode:
    {% set control = params.CONTROL %}
    {% set value = params.VALUE|int %}
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c {control}={value}"

[gcode_macro BRIGHTNESS]
gcode:
    {% if 'BRIGHTNESS' in params %}
        {% set brightness = params.BRIGHTNESS|int %}
        {% if brightness >= 0 and brightness <= 255 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c brightness={brightness}"
        {% else %}
            {action_respond_info("Error: BRIGHTNESS must be between 0 and 255")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: BRIGHTNESS BRIGHTNESS=<0-255>")}
    {% endif %}

[gcode_macro CONTRAST]
gcode:
    {% if 'CONTRAST' in params %}
        {% set contrast = params.CONTRAST|int %}
        {% if contrast >= 0 and contrast <= 255 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c contrast={contrast}"
        {% else %}
            {action_respond_info("Error: CONTRAST must be between 0 and 255")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: CONTRAST CONTRAST=<0-255>")}
    {% endif %}

[gcode_macro SATURATION]
gcode:
    {% if 'SATURATION' in params %}
        {% set saturation = params.SATURATION|int %}
        {% if saturation >= 0 and saturation <= 255 %}
