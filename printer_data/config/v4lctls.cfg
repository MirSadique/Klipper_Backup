    {% endif %}

[gcode_macro BACKLIGHT_COMPENSATION]
gcode:
    {% if 'COMPENSATION' in params %}
        {% set compensation = params.COMPENSATION|int %}
        {% if compensation >= 0 and compensation <= 1 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c backlight_compensation={compensation}"
        {% else %}
            {action_respond_info("Error: COMPENSATION must be 0 or 1")}
        {% endif %}
    {% else %}
