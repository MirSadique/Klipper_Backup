    {% endif %}

[gcode_macro AUTO_EXPOSURE]
gcode:
    {% if 'MODE' in params %}
        {% set mode = params.MODE|int %}
        {% if mode >= 0 and mode <= 3 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c auto_exposure={mode}"
        {% else %}
            {action_respond_info("Error: MODE must be between 0 and 3 (1: Manual, 3: Aperture Priority)")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: AUTO_EXPOSURE MODE=<0-3>")}
    {% endif %}

[gcode_macro EXPOSURE_TIME_ABSOLUTE]
gcode:
    {% if 'TIME' in params %}
        {% set time = params.TIME|int %}
        {% set min_time = 3 %} # Adjust based on your camera's minimum exposure time
        {% set max_time = 2047 %} # Adjust based on your camera's maximum exposure time
        {% if time >= min_time and time <= max_time %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c auto_exposure=1" # Set to manual mode
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c exposure_time_absolute={time}"
        {% else %}
            {action_respond_info("Error: TIME must be between " + min_time|string + " and " + max_time|string)}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: EXPOSURE_TIME_ABSOLUTE TIME=<" + min_time|string + "-" + max_time|string + ">")}
    {% endif %}

[gcode_macro EXPOSURE_DYNAMIC_FRAMERATE]
gcode:
    {% if 'ENABLE' in params %}
        {% set enable = params.ENABLE|int %}
        {% if enable == 0 or enable == 1 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c exposure_dynamic_framerate={enable}"
        {% else %}
            {action_respond_info("Error: ENABLE must be 0 or 1")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: EXPOSURE_DYNAMIC_FRAMERATE ENABLE=<0 or 1>")}
    {% endif %}

[gcode_macro PAN_ABSOLUTE]
gcode:
    {% if 'PAN' in params %}
        {% set pan = params.PAN|int %}
        {% if pan >= -36000 and pan <= 36000 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c pan_absolute={pan}"
        {% else %}
            {action_respond_info("Error: PAN must be between -36000 and 36000")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: PAN_ABSOLUTE PAN=<-36000-36000>")}
    {% endif %}
[gcode_macro FOCUS_AUTO_CONTINUOUS_ON]
gcode:
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c focus_automatic_continuous=1"

[gcode_macro FOCUS_AUTO_CONTINUOUS_OFF]
gcode:
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c focus_automatic_continuous=0"

[gcode_macro FOCUS_ABSOLUTE]
gcode:
    {% if 'FOCUS' in params %}
        {% set focus = params.FOCUS|int %}
        {% if focus >= 0 and focus <= 255 %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c focus_absolute={focus}"
        {% else %}
            {action_respond_info("Error: FOCUS must be between 0 and 255")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: FOCUS_ABSOLUTE FOCUS=<0-255>")}
    {% endif %}
[gcode_shell_command v4l2-ctl]
command: v4l2-ctl -d /dev/video0 # Replace /dev/video0 with your device path
timeout: 5.0
verbose: True

[gcode_macro ZOOM_ABSOLUTE]
gcode:
    {% if 'ZOOM' in params %}
        {% set zoom = params.ZOOM|int %}
        {% if zoom >= 100 and zoom <= 400 %}
            _SET_CAMERA_CONTROL CONTROL="zoom_absolute" VALUE="{zoom}"
        {% else %}
            {action_respond_info("Error: ZOOM must be between 100 and 400")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: ZOOM_ABSOLUTE ZOOM=<100-400>")}
    {% endif %}



[gcode_macro ADJUST_FRAMERATE]
gcode:
    {% if 'STEP' in params %}
        {% set step = params.STEP|int %}
        RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c auto_exposure=1" # Set to manual mode
        RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="--get-ctrl=exposure_time_absolute"
        QUERY_GCODE_SHELL_COMMAND CMD=v4l2-ctl # Wait for the command to finish
        {% set result = printer.gcode_shell_command.v4l2_ctl.result|default('') %}
        {% set start_index = result.find("value=") + 6 %}
        {% if start_index > 5 %}
            {% set exposure_str = result[start_index:] %}
            {% set current_exposure = exposure_str|int %}
            {% if step == 0 %}
                {% set new_exposure = current_exposure + 50 %} # Decrease frame rate by a small amount
            {% else %}
                {% set new_exposure = current_exposure + step %}
            {% endif %}
            {% if new_exposure < 3 %}
                {% set new_exposure = 3 %}
            {% elif new_exposure > 2047 %}
                {% set new_exposure = 2047 %}
            {% endif %}
            RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c exposure_time_absolute={new_exposure}"
            {action_respond_info("Exposure time set to: " + new_exposure|string)}
        {% else %}
            {action_respond_info("Could not retrieve current exposure time.")}
        {% endif %}
    {% else %}
        {action_respond_info("Usage: ADJUST_FRAMERATE STEP=<value>")}
    {% endif %}

[gcode_macro WEBCAM_OPTIMIZE]
gcode:
    # Enable Auto Settings
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c auto_exposure=3" # Aperture Priority Mode
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c white_balance_automatic=1"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c focus_automatic_continuous=1"

    # Set Sensible Defaults (for settings without auto)
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c brightness=128"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c contrast=128"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c saturation=128"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c gain=128"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c sharpness=128"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c backlight_compensation=0"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c pan_absolute=0"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c tilt_absolute=0"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c zoom_absolute=100"
    RUN_SHELL_COMMAND CMD=v4l2-ctl PARAMS="-c power_line_frequency=1" # 60 Hz (adjust as needed)
    # Add a short delay to allow camera to adjust.
    G4 P1000 # Delay for 1 second (1000 milliseconds)

    # Optional: Fine-tune (this is where it gets tricky)
    # This section is highly experimental and depends on your camera.
    # You might try to read the current exposure value and adjust brightness/gain.
    # However, this is complex and error-prone.
    # Example (very basic, might not work well):
    # RUN_SHELL_COMMAND CMD="bash" PARAMS="-c 'exposure=$(v4l2-ctl -d /dev/video0 --get-ctrl=exposure_absolute); if [[ $exposure -lt 100 ]]; then v4l2-ctl -c gain=150; fi'"