# This file contains common pin mappings for the BigTreeTech Octopus
# (non-Pro) boards.

# Important! Do not use this config with an Octopus Pro v1.1 board as
# doing so could result in a heater being inadvertently enabled.

# To use this config, start by identifying the micro-controller on the
# board - it may be an STM32F446, or STM32F429.  Select the
# appropriate micro-controller in "make menuconfig" and select "Enable
# low-level configuration options". For STM32F446 boards the firmware
# should be compiled with a "32KiB bootloader" and a "12MHz crystal"
# clock reference. For STM32F429 boards use a "32KiB bootloader" and
# an "8MHz crystal".

# CAN bus is also available on this board

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500
max_z_velocity: 5
max_z_accel: 100


[include mainsail.cfg]
[include macros.cfg]
[include LCD.cfg]
[include Adaptive_Mesh.cfg]
[include Line_Purge.cfg]
[include Smart_Park.cfg]
[include KAMP_Settings.cfg]
[include v4lctls.cfg]
[include timelapse.cfg]
#[include adxl.cfg] # Comment this out when you disconnect the accelerometer



# See docs/Config_Reference.md for a description of parameters.
# Driver0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 285
homing_speed: 50
homing_positive_dir: False

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 285
homing_speed: 50
homing_positive_dir: False

# Driver2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 200
position_min: -5

[stepper_z1]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop


[extruder]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 22.9614
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2 # HE0
sensor_pin:  PF4 # T0
sensor_type: EPCOS 100K B57560G104F
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 250
max_extrude_only_distance: 100.0
max_extrude_cross_section: 5


#####################################
#   HEATER Config
#####################################

[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: EPCOS 100K B57560G104F
#control: watermark
min_temp: 0
max_temp: 120
#pwm_cycle_time: 0.02


[fan]
pin: PA8

[heater_fan heatbreak_cooling_fan]
pin: PE5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

#[heater_fan fan2]
#pin: PD12

#[heater_fan fan3]
#pin: PD13

#[heater_fan fan4]
#pin: PD14

#[controller_fan fan5]
#pin: PD15
[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_0D0044001850535556323420-if00
[exclude_object]

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: PG6
run_current: 0.1100
stealthchop_threshold: 999999
driver_SGTHRS: 80

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: PG9
run_current: 0.1200
stealthchop_threshold: 999999
driver_SGTHRS: 70

[tmc2209 stepper_z]
uart_pin: PC6
diag_pin: PG10
run_current: 0.700
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: PC7
diag_pin: PG11
run_current: 0.700
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PF2
run_current: 0.800
stealthchop_threshold: 999999



[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5



##############################
#    probe section
##############################

[probe]
pin: ~!PB7 

x_offset: 29
y_offset: 0
#z_offset: 0

speed: 5.0
samples: 3
sample_retract_dist: 5
samples_result: median
samples_tolerance: 0.06
samples_tolerance_retries: 3
#activate_gcode:
#deactivate_gcode:

############################
#   Auto Gantry leveling
############################

[z_tilt]
z_positions: 
    352, 10
    -42, 10
points:
    255, 150 # example points, adjust to your bed
    5, 150 # example points, adjust to your bed
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02

############################
#   Auto Bed leveling
############################

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 29, 5
mesh_max: 285, 285
probe_count: 10, 7
fade_start: 1.0
fade_end: 10.0
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: .2


[safe_z_home]

home_xy_position: 145, 145
speed: 100
z_hop: 8

# [delayed_gcode shell_command_enable]
# initial_duration: 1
# gcode:
#     RUN_SHELL_COMMAND CMD=echo "Shell commands enabled"

    
